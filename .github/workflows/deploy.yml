name: Deploy

# Rebuild & redeploy the Docker Compose stack on the server whenever main moves.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never let two deploys run at once; queue instead of cancelling a live deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Rebuild and redeploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "==> Pulling latest main into $(pwd)"
          git fetch --prune origin
          git pull --ff-only
          echo "==> Rebuilding and redeploying (migrate runs before the apps)"
          docker compose up -d --build
          echo "==> Pruning dangling images"
          docker image prune -f
          echo "==> Current state:"
          docker compose ps
          REMOTE
