name: Deploy

# Rebuild & redeploy the Docker Compose stack on the server on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never let two deploys run at once; queue instead of cancelling a live deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (rebuild & restart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same SSH mechanics as the known-good deploy in the other repo — only the
      # remote command differs (we build from the git checkout instead of pulling
      # a prebuilt image). Uses this repo's SSH_* secrets; set their VALUES to
      # match the working repo's DEPLOY_* secrets (host / user / port / key).
      - name: Rebuild & restart docker-compose over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$DEPLOY_PATH'; git fetch --prune origin; git pull --ff-only; docker compose up -d --build; docker image prune -f; docker compose ps"
